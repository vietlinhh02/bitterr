<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận diện Thuốc - API Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 20px;
            background-color: #f8f9fa;
        }
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #343a40;
        }
        .upload-container {
            border: 2px dashed #ced4da;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            background-color: #f8f9fa;
            transition: all 0.3s;
        }
        .upload-container:hover {
            border-color: #6c757d;
            background-color: #e9ecef;
        }
        .preview-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .preview-box {
            width: 48%;
            margin-bottom: 20px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            padding: 10px;
            background-color: white;
        }
        .preview-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
        }
        .result-table {
            margin-top: 20px;
        }
        .spinner-border {
            display: none;
            margin: 0 auto;
        }
        .detection-info {
            margin-top: 20px;
        }
        #fileInput {
            display: none;
        }
        .custom-file-label {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .custom-file-label:hover {
            background-color: #0069d9;
        }
        .alert {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container main-container">
        <div class="header">
            <h1>Hệ thống Nhận diện Thuốc</h1>
            <p class="text-muted">Tải lên ảnh để nhận diện loại thuốc và thông tin liên quan</p>
        </div>

        <div class="upload-container" id="dropArea">
            <p>Kéo thả ảnh vào đây hoặc</p>
            <label for="fileInput" class="custom-file-label">Chọn File</label>
            <input type="file" id="fileInput" accept="image/*">
            <p class="text-muted mt-2">Hỗ trợ định dạng: JPG, JPEG, PNG</p>
        </div>

        <div class="spinner-border text-primary" role="status" id="loadingSpinner">
            <span class="visually-hidden">Đang xử lý...</span>
        </div>

        <div class="alert alert-danger" id="errorAlert" role="alert"></div>

        <div class="preview-container" id="previewContainer" style="display: none;">
            <div class="preview-box">
                <h5>Ảnh gốc</h5>
                <img id="originalImage" class="preview-image" alt="Ảnh gốc">
            </div>
            <div class="preview-box">
                <h5>Kết quả nhận diện</h5>
                <img id="resultImage" class="preview-image" alt="Kết quả nhận diện">
            </div>
        </div>

        <div class="detection-info" id="detectionInfo" style="display: none;">
            <h4>Thông tin chi tiết</h4>
            <div class="table-responsive">
                <table class="table table-striped table-hover result-table">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Tên thuốc</th>
                            <th>Mã thuốc</th>
                            <th>Độ tin cậy (%)</th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody">
                        <!-- Dữ liệu sẽ được thêm ở đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dropArea = document.getElementById('dropArea');
            const fileInput = document.getElementById('fileInput');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const previewContainer = document.getElementById('previewContainer');
            const originalImage = document.getElementById('originalImage');
            const resultImage = document.getElementById('resultImage');
            const detectionInfo = document.getElementById('detectionInfo');
            const resultTableBody = document.getElementById('resultTableBody');
            const errorAlert = document.getElementById('errorAlert');

            // Ngăn chặn hành vi mặc định khi kéo thả
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            // Hiệu ứng khi kéo file vào vùng drop
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });

            function highlight() {
                dropArea.style.borderColor = '#007bff';
                dropArea.style.backgroundColor = '#e6f2ff';
            }

            function unhighlight() {
                dropArea.style.borderColor = '#ced4da';
                dropArea.style.backgroundColor = '#f8f9fa';
            }

            // Xử lý sự kiện drop
            dropArea.addEventListener('drop', handleDrop, false);
            fileInput.addEventListener('change', handleFileSelect, false);

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                
                if (files.length) {
                    handleFiles(files[0]);
                }
            }

            function handleFileSelect() {
                if (fileInput.files.length) {
                    handleFiles(fileInput.files[0]);
                }
            }

            function handleFiles(file) {
                // Kiểm tra định dạng file
                const validTypes = ['image/jpeg', 'image/jpg', 'image/png'];
                if (!validTypes.includes(file.type)) {
                    showError('Chỉ hỗ trợ định dạng JPG, JPEG và PNG');
                    return;
                }

                // Hiển thị ảnh gốc
                const reader = new FileReader();
                reader.onload = function(e) {
                    originalImage.src = e.target.result;
                    previewContainer.style.display = 'flex';
                    resultImage.src = ''; // Xóa ảnh kết quả cũ
                    detectionInfo.style.display = 'none'; // Ẩn thông tin kết quả cũ
                };
                reader.readAsDataURL(file);

                // Gửi ảnh lên API
                uploadImage(file);
            }

            function uploadImage(file) {
                const formData = new FormData();
                formData.append('image', file);
                
                // Hiển thị loading
                loadingSpinner.style.display = 'block';
                hideError();
                
                fetch('/detect/', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.detail || 'Lỗi không xác định');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    // Hiển thị ảnh kết quả
                    const baseUrl = window.location.origin;
                    resultImage.src = baseUrl + data.image_path;
                    
                    // Hiển thị thông tin chi tiết
                    resultTableBody.innerHTML = '';
                    if (data.detections && data.detections.length > 0) {
                        data.detections.forEach((detection, index) => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${index + 1}</td>
                                <td>${detection.medication_name || 'Không xác định'}</td>
                                <td>${detection.medication_id || 'N/A'}</td>
                                <td>${Math.round(detection.confidence * 100)}%</td>
                            `;
                            resultTableBody.appendChild(row);
                        });
                        detectionInfo.style.display = 'block';
                    } else {
                        // Không tìm thấy thuốc nào
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td colspan="4" class="text-center">Không phát hiện thuốc nào trong ảnh</td>
                        `;
                        resultTableBody.appendChild(row);
                        detectionInfo.style.display = 'block';
                    }
                })
                .catch(error => {
                    showError(`Lỗi: ${error.message}`);
                    console.error('Error:', error);
                })
                .finally(() => {
                    loadingSpinner.style.display = 'none';
                });
            }

            function showError(message) {
                errorAlert.textContent = message;
                errorAlert.style.display = 'block';
            }

            function hideError() {
                errorAlert.style.display = 'none';
            }
        });
    </script>
</body>
</html>
